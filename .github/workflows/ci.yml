name: Nexus 3.0 CI

on:
  push:
    branches: [develop/v3.0]
  pull_request:
    branches: [develop/v3.0]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sintaxe
        run: python -m compileall -q nexus3 nexus3.py
      - name: Testes unitários e de portabilidade
        run: python nexus3.py selftest
      - name: Diagnóstico (informativo — sem motor/modelo no CI)
        run: python nexus3.py doctor --informational
      - name: Pacotes portáteis
        run: python nexus3.py build
      - name: Verificar launchers POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/start-linux.sh scripts/start-macos.command scripts/doctor.sh
      - name: Verificar launcher Windows (sintaxe + caminho relativo)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bat = Get-Content scripts/start-windows.bat -Raw
          if ($bat -notmatch 'cd /d "%~dp0\.\."') { throw 'launcher Windows sem cd relativo' }
          if ($bat -notmatch 'NEXUS3_ROOT') { throw 'launcher Windows sem NEXUS3_ROOT' }
          if ($bat -notmatch 'py -3') { throw 'launcher Windows sem fallback py -3' }
          Write-Host 'launcher Windows: estrutura OK'
      - uses: actions/upload-artifact@v4
        with:
          name: nexus3-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar hashes do manifesto
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from nexus3.engine import ENGINE_MANIFEST
          from nexus3.models import ModelRegistry
          from pathlib import Path
          ok = True
          for key, item in ENGINE_MANIFEST.items():
              ok &= len(item['sha256']) == 64 and item['size'] > 0
          reg = ModelRegistry(Path('.'))
          for spec in reg.all():
              for f in spec.files:
                  ok &= len(f.sha256) == 64 and f.size > 0
          print('manifesto íntegro' if ok else 'falha de integridade')
          sys.exit(0 if ok else 1)
          PY

  # Homologação: INFERÊNCIA REAL com motor e modelo baixados e verificados.
  # Estes jobs são a evidência de homologação — selftest/doctor NÃO bastam.
  homologacao:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: win-cpu-x64
          - os: ubuntu-latest
            plataforma: ubuntu-x64
          - os: macos-latest      # Apple Silicon (arm64)
            plataforma: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirmar arquitetura do runner
        shell: bash
        run: |
          echo "OS=${{ runner.os }} ARCH=$(uname -m) PLATAFORMA=${{ matrix.plataforma }}"
          python -c "from nexus3.platform import detect_platform; p=detect_platform(); print('engine_key:',p.engine_key); assert p.engine_key=='${{ matrix.plataforma }}', f'esperado ${{ matrix.plataforma }}, obtido {p.engine_key}'"
      - name: Instalar motor verificado (download com SHA-256)
        run: python nexus3.py setup --yes
      - name: Instalar modelo Qwen3 0.6B verificado (SHA-256)
        run: python nexus3.py models install qwen3-0.6b-q8 --yes
      - name: Homologação — inferência real, SSE, RAG, API e shutdown
        run: python -u scripts/homologate.py
      - name: Publicar evidência de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ matrix.plataforma }}
          path: logs/homologation-evidence.json
          if-no-files-found: warn
